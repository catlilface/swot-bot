[project]
name = "swot-workspace"
version = "1.0.0"
description = "swot-bot monorepo workspace root (uv)"
requires-python = ">=3.13"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "mypy>=2.3.1",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
swot-contracts = { workspace = true }
swot-observability = { workspace = true }
swot-bus = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["packages", "services", "tests"]
include = ["*.py"]

extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
# close-to-strict (T-1.8): полный --strict несовместим с внешними lib
# (aiogram/aio_pika), поэтому согласованный набор ниже.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["aio_pika.*", "aio_pika"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["yt_dlp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
