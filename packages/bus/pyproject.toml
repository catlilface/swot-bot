[project]
name = "swot-bus"
version = "0.1.0"
description = "Message bus adapters (RabbitMQ via aio-pika + FakeBus) and JobRegistry for swot-bot"
requires-python = ">=3.13"
dependencies = [
    "swot-contracts>=0.1.0",
    "aio-pika>=9.5",
    "dishka>=1.10",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swot_bus"]
