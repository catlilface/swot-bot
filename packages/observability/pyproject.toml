[project]
name = "swot-observability"
version = "0.1.0"
description = "Shared observability: structlog config, trace_id, healthz for swot-bot"
requires-python = ">=3.13"
dependencies = [
    "structlog>=24.4",
    "aiohttp>=3.11",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swot_observability"]
