[project]
name = "swot-contracts"
version = "0.1.0"
description = "Shared message contracts (Pydantic v2) for swot-bot services"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swot_contracts"]
