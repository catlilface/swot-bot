# pre-commit конфигурация swot-bot
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Локальные хуки, повторяющие проверки из .github/workflows/ci.yml
  # (mypy и тесты требуют окружение workspace, поэтому language: system + uv run)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (packages services)
        entry: uv run mypy packages services
        language: system
        pass_filenames: false
        # mypy работает с явными путями, файлы не передаём
      - id: unit-tests
        name: unit tests (pytest tests/unit)
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
      - id: import-packages
        name: import all workspace packages
        entry: uv run python -c "import swot_contracts, swot_observability, swot_bus, swot_bot, swot_downloader, swot_transcriber, swot_analyzer; print('imports OK')"
        language: system
        pass_filenames: false
