[project]
name = "swot-analyzer"
version = "0.1.0"
description = "Analyzer service: Langfuse prompt + LLM (OpenAI-compatible) -> structured summary.json"
requires-python = ">=3.13"
dependencies = [
    "swot-contracts>=0.1.0",
    "swot-observability>=0.1.0",
    "swot-bus>=0.1.0",
    "dishka>=1.10",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "langfuse>=4,<5",
    "openai>=1.55",
]

[project.scripts]
swot-analyzer = "swot_analyzer.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swot_analyzer"]
