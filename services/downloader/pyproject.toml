[project]
name = "swot-downloader"
version = "0.1.0"
description = "Downloader service: adapters per source (yandex disk, gdrive, vk, rutube, direct) -> shared volume"
requires-python = ">=3.13"
dependencies = [
    "swot-contracts>=0.1.0",
    "swot-observability>=0.1.0",
    "swot-bus>=0.1.0",
    "dishka>=1.10",
    "yt-dlp>=2025.6.30",
    "aiohttp>=3.11",
]

[project.scripts]
swot-downloader = "swot_downloader.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swot_downloader"]
