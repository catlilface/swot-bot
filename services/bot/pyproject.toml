[project]
name = "swot-bot"
version = "0.1.0"
description = "AIogram telegram bot service for swot-bot: receives links, publishes commands, renders and sends results"
requires-python = ">=3.13"
dependencies = [
    "swot-contracts>=0.1.0",
    "swot-observability>=0.1.0",
    "swot-bus>=0.1.0",
    "dishka>=1.10",
    "aiogram>=3.15",
    "jinja2>=3.1",
]

[project.scripts]
swot-bot = "swot_bot.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swot_bot"]
