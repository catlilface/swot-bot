[project]
name = "swot-transcriber"
version = "0.1.0"
description = "Transcriber service: ffmpeg audio extraction + OpenAI-compatible ASR -> transcript.srt + segments.json"
requires-python = ">=3.13"
dependencies = [
    "swot-contracts>=0.1.0",
    "swot-observability>=0.1.0",
    "swot-bus>=0.1.0",
    "dishka>=1.10",
    "openai>=1.55",
]

[project.scripts]
swot-transcriber = "swot_transcriber.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swot_transcriber"]
