name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Ruff lint
        run: uv run ruff check .

      - name: Tests (unit)
        run: uv run pytest tests/unit -q

      - name: Import all packages
        run: |
          uv run python -c "import swot_contracts, swot_observability, swot_bus, swot_bot, swot_downloader, swot_transcriber, swot_analyzer; print('imports OK')"

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --all-packages

      # Blocks the merge on any type error (close-to-strict set from pyproject.toml, T-1.8).
      - name: Mypy
        run: uv run mypy packages services

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all images + smoke-import
        run: |
          for svc in bot downloader transcriber analyzer; do
            docker build -f .docker/$svc/Dockerfile -t swot-bot-$svc .
            # Fails the job on ModuleNotFoundError (deps must be in the runtime image).
            docker run --rm swot-bot-$svc python -c "import swot_$svc; print('import OK: swot_$svc')"
          done
          docker run --rm swot-bot-bot python -c "import aiogram, aio_pika, structlog; print('smoke deps OK')"

      # Tag with the names docker-compose.slim.yml expects on the server, so a
      # `docker load` + `docker compose up -d` there reuses these images (no local build).
      - name: Tag images for deployment
        run: |
          for svc in bot downloader transcriber analyzer; do
            docker tag "swot-bot-$svc" "swot-bot/$svc:dev"
          done

      - name: Save images to artifact
        run: |
          docker save swot-bot/bot:dev swot-bot/downloader:dev \
            swot-bot/transcriber:dev swot-bot/analyzer:dev -o swot-images.tar
          gzip -9 swot-images.tar
          ls -lh swot-images.tar.gz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: swot-images
          path: swot-images.tar.gz
          retention-days: 7
